<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2120 1010" width="2120" height="1010" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <symbol id="fuse" viewBox="0 0 28 28">
      <rect x="1.5" y="1.5" width="25" height="25" rx="5" fill="#2a2210" stroke="#f0b93a" stroke-width="2.5"/>
      <path d="M16 4 L8 15 H13 L11 24 L20 12 H15 Z" fill="#f0b93a"/>
    </symbol>
    <style>
      .floor { fill: #1d2530; stroke: #d5dde7; stroke-width: 4; stroke-linejoin: round; }
      .room  { fill: #1d2530; stroke: #d5dde7; stroke-width: 4; stroke-linejoin: round; }
      .wall  { stroke: #d5dde7; stroke-width: 4; stroke-linecap: round; }
      .furn  { fill: none; stroke: #4c596a; stroke-width: 2; }
      .stair { fill: #283241; stroke: #8b98aa; stroke-width: 2; }
      .tread { stroke: #8b98aa; stroke-width: 1.5; }
      .rail  { stroke: #8b98aa; stroke-width: 2; stroke-dasharray: 6 5; }
      .win   { stroke: #5fb6ff; stroke-width: 6; stroke-linecap: round; }
      .door  { stroke: #4fd394; stroke-width: 7; stroke-linecap: round; }
      .lbl   { fill: #eef2f6; font-size: 21px; text-anchor: middle; }
      .lbl-s { fill: #a9b4c2; font-size: 14px; text-anchor: middle; }
      .floor-title { fill: #7fd8cd; font-size: 26px; font-weight: 700; letter-spacing: 2px; }
      .legend { fill: #c9d2dc; font-size: 18px; }
    </style>
  </defs>

  <rect width="2120" height="1010" fill="#10151b"/>

  <text x="60" y="78" fill="#eef2f6" font-size="46" font-weight="700">10 Ridgeview Court</text>
  <text x="62" y="112" fill="#8d99a8" font-size="18">Small map · 3 floors</text>

