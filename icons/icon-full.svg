<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed version for home-screen icons: phones add their own rounded corners,
       and Android may crop to a circle, so the art sits inside the central 80%. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18222d"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f0e6"/>
      <stop offset="1" stop-color="#3fa597"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(.78) translate(-256 -250)">
    <path filter="url(#glow)" fill="url(#ghost)"
          d="M256 92c-78 0-132 58-132 140v176l40-30 30 30 31-30 31 30 31-30 30 30 40-30V232c0-82-54-140-132-140z"/>
    <ellipse cx="214" cy="232" rx="20" ry="28" fill="#0b0f14"/>
    <ellipse cx="298" cy="232" rx="20" ry="28" fill="#0b0f14"/>
    <circle cx="372" cy="372" r="74" fill="#0b0f14"/>
    <circle cx="372" cy="372" r="60" fill="#4fd394"/>
    <path d="M342 372l22 22 40-44" fill="none" stroke="#0b0f14" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
